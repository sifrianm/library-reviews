name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time, but never cancel one mid-flight:
# cancelling an in-progress deployment can leave it stuck server-side and block
# future deployments (this matches GitHub's recommended Pages workflow).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # deploy-pages caps its timeout at 600000 ms (10 min), which is also the
        # default, so we don't override it. If a deploy ever times out due to a
        # slow Pages backend, just re-run the workflow.
        uses: actions/deploy-pages@v5
